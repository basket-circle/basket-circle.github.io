<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>出席票</title>
<style>
  body { font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif; margin:0; padding:16px; background:#f7f8fa; color:#333; }
  h1 { font-size:20px; text-align:center; }
  #loading { text-align:center; padding:56px 0; }
  .ball { font-size:46px; line-height:1; animation:dribble .5s cubic-bezier(.3,0,.5,1) infinite alternate; }
  @keyframes dribble { from{ transform:translateY(-24px) } to{ transform:translateY(0) } }
  .shadow { width:34px; height:7px; margin:6px auto 0; background:rgba(0,0,0,.12); border-radius:50%; animation:sh .5s cubic-bezier(.3,0,.5,1) infinite alternate; }
  @keyframes sh { from{ transform:scaleX(.55); opacity:.35 } to{ transform:scaleX(1); opacity:.65 } }
  .loadmsg { margin-top:14px; font-size:14px; color:#888; }
  .event { background:#fff; border-radius:12px; padding:16px; margin:0 auto 16px; max-width:460px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .ev-head { display:grid; grid-template-columns:1fr auto; align-items:center; column-gap:8px; }
  .ev-date { font-size:17px; font-weight:bold; }
  .tag { font-size:12px; padding:2px 8px; border-radius:10px; background:#eef; color:#446; }
  .tag.match { background:#ffecec; color:#c33; }
  .tag.event { background:#fff4e0; color:#b80; }
  .ev-head .tag { white-space:nowrap; justify-self:end; }
  .ev-sub { color:#666; font-size:13px; margin:4px 0 10px; }
  .bar-wrap { background:#eee; border-radius:8px; height:14px; overflow:hidden; margin:6px 0; }
  .bar { background:#06c755; height:100%; width:0; }
  .line-info { font-size:13px; font-weight:bold; }
  .line-ok { color:#06c755; }
  .roster { margin:8px 0; font-size:14px; }
  .roster .label { font-weight:bold; color:#555; }
  .person { display:inline-block; margin:2px 6px 2px 0; }
  .btns { display:flex; gap:8px; margin-top:12px; }
  .btns button { flex:1; padding:10px; font-size:14px; font-weight:bold; border:2px solid #ccc; border-radius:8px; background:#fff; color:#555; }
  .btns button.on-join { border-color:#06c755; background:#06c755; color:#fff; }
  .btns button.on-undecided { border-color:#f0a020; background:#f0a020; color:#fff; }
  .btns button.on-absent { border-color:#999; background:#999; color:#fff; }
  .btns button.on-shooting { border-color:#e08600; background:#e08600; color:#fff; }
  .mystat { font-size:12px; color:#888; margin-top:6px; text-align:right; }
  #empty { text-align:center; color:#888; padding:30px; }
    .tagpill{display:inline-block;color:#fff;font-size:11px;font-weight:bold;padding:1px 7px;border-radius:9px;margin-right:5px;}
    .breakdown{font-size:12px;color:#666;margin:2px 0 8px;}
    .person{display:block;margin:4px 0;}
  .add-guest { margin-top:4px; background:none; border:1px dashed #bbb; color:#777; border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .guest-rm { color:#c0392b; margin-left:6px; cursor:pointer; font-weight:bold; }
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; }
  .modal { background:#fff; max-width:360px; margin:18vh auto 0; border-radius:12px; padding:18px; }
  .modal-title { font-size:16px; font-weight:bold; }
  .modal-sub { font-size:12px; color:#666; margin:4px 0 8px; }
  .glabel { display:block; font-weight:bold; font-size:13px; margin:12px 0 4px; }
  #guestName { width:100%; box-sizing:border-box; padding:10px; font-size:16px; border:1px solid #ccc; border-radius:8px; }
  .glevels { display:flex; flex-direction:column; gap:8px; }
  .glevels label { font-size:15px; }
  .modal-btns { display:flex; gap:8px; margin-top:18px; }
  .modal-btns button { flex:1; padding:11px; font-size:14px; font-weight:bold; border-radius:8px; border:none; }
  .mbtn-cancel { background:#eee; color:#555; }
  .mbtn-ok { background:#06c755; color:#fff; }
</style>
</head>
<body>
  <div id="loading">
    <div class="ball">🏀</div>
    <div class="shadow"></div>
    <div class="loadmsg">読み込み中…</div>
  </div>
  <div id="container" style="display:none;">
    <h1>📋 出席票</h1>
    <div id="regBanner" style="display:none; background:#fff8e1; border:1px solid #ffe0a3; border-radius:10px; padding:12px 14px; margin:0 auto 14px; max-width:460px; font-size:13px; line-height:1.6;">
      プロフィール未登録です。よかったらメニューのプロフィール登録画面から登録してください🏀
      <div><a href="https://liff.line.me/2010311760-E5ENH95n" style="display:inline-block; margin-top:8px; background:#06c755; color:#fff; padding:8px 16px; border-radius:8px; text-decoration:none; font-weight:bold;">プロフィール登録画面へ</a></div>
    </div>
    <div id="events"></div>
    <div id="empty" style="display:none;">公開中の活動はまだありません。</div>
  </div>

  <div id="guestModal" class="modal-bg">
    <div class="modal">
      <div class="modal-title">体験者を追加</div>
      <div id="guestEvLabel" class="modal-sub"></div>
      <label class="glabel">お名前</label>
      <input type="text" id="guestName" maxlength="20" placeholder="例：ゲスト花子">
      <label class="glabel">レベル</label>
      <div class="glevels">
        <label><input type="radio" name="glevel" value="経験者"> 🟢 経験者</label>
        <label><input type="radio" name="glevel" value="ブランク勢"> 🟡 ブランク勢</label>
        <label><input type="radio" name="glevel" value="初心者"> 🔵 初心者</label>
      </div>
      <div class="modal-btns">
        <button id="guestCancel" class="mbtn-cancel">キャンセル</button>
        <button id="guestSubmit" class="mbtn-ok">追加する</button>
      </div>
    </div>
  </div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = "2010311760-vcFkg3tX";
  const API = "https://script.google.com/macros/s/AKfycbziHmBXwwFiH6cTbouTHRNLhORzMO629xUBwi0jGIjX9TsJC0iPuse1KAF7r-UDPDnT/exec";
  let userId = null;
  let myProfile = { displayName:'', level:'', category:'', transport:'' };
  let boardData = [];
  let savingEvents = {};   // eventId -> true（送信中。連打による書き込み競合を防ぐ）
  const loadingEl = document.getElementById('loading');

  const LEVEL_TAG = {
    '経験者':   { short:'経験',     bg:'#06c755' },
    'ブランク勢': { short:'ブランク', bg:'#f0a020' },
    '初心者':   { short:'初心',     bg:'#3b9cff' }
  };
  const CAT_TAG = {
    '高校生': { short:'高校',   bg:'#ef6c9a' },
    '大学生': { short:'大学',   bg:'#9575cd' },
    '社会人': { short:'社会人', bg:'#4db6ac' }
  };
  const TRANS_TAG = {
    '電車(京都方面)': { short:'🚃京都',   bg:'#7e8aa0' },
    '電車(草津方面)': { short:'🚃草津',   bg:'#7e8aa0' },
    '車':       { short:'🚗車',     bg:'#7e8aa0' },
    '自転車':   { short:'🚲自転車', bg:'#7e8aa0' },
    '徒歩':     { short:'🚶徒歩',   bg:'#7e8aa0' }
  };
  function tagFrom(map, val){ const t=map[val]; return t ? '<span class="tagpill" style="background:'+t.bg+'">'+t.short+'</span>' : ''; }
  function levelTag(level){
    const t = LEVEL_TAG[level] || { short:'未登録', bg:'#bbbbbb' };
    return '<span class="tagpill" style="background:'+t.bg+'">'+t.short+'</span>';
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  const GUEST_TAG = '<span class="tagpill" style="background:#ff7043">体験</span>';
  function personHtml(p){
    if (p.isGuest){
      const rm = (String(p.byUserId)===String(userId)) ? ' <span class="guest-rm" data-gid="'+p.guestId+'">✕</span>' : '';
      return '<span class="person">'+GUEST_TAG+levelTag(p.level)+escapeHtml(p.displayName)+rm+'</span>';
    }
    return '<span class="person">'+levelTag(p.level)+tagFrom(CAT_TAG,p.category)+tagFrom(TRANS_TAG,p.transport)+escapeHtml(p.displayName)+'</span>';
  }
  function tagClass(kind){ if(kind==='練習試合') return 'tag match'; if(kind==='イベント') return 'tag event'; return 'tag'; }
  function breakdownText(list){
    let exp=0, blank=0, beg=0, none=0, guest=0;
    list.forEach(function(p){
      if(p.isGuest)guest++;
      if(p.level==='経験者')exp++; else if(p.level==='ブランク勢')blank++; else if(p.level==='初心者')beg++; else none++;
    });
    return '内訳：経験'+exp+'・ブランク'+blank+'・初心'+beg+(none?'・未登録'+none:'')+(guest?'（うち体験'+guest+'）':'');
  }

  let cbSeq = 0;
  function callApi(params){
    return new Promise(function(resolve, reject){
      const cbName = 'jcb_' + (cbSeq++);
      let s;
      const to = setTimeout(function(){ cleanup(); reject('タイムアウト'); }, 15000);
      function cleanup(){ try{ delete window[cbName]; }catch(e){} if(s&&s.parentNode) s.parentNode.removeChild(s); clearTimeout(to); }
      window[cbName] = function(res){ cleanup(); resolve(res); };
      params.callback = cbName;
      const qs = Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
      s = document.createElement('script');
      s.src = API + '?' + qs;
      s.onerror = function(){ cleanup(); reject('通信エラー'); };
      document.body.appendChild(s);
    });
  }

  function render(board){
    const wrap = document.getElementById('events');
    wrap.innerHTML = '';
    if(!board || board.length===0){ document.getElementById('empty').style.display='block'; return; }
    document.getElementById('empty').style.display='none';
    board.forEach(function(ev){
      const pct = ev.line>0 ? Math.min(100, Math.round(ev.joinCount/ev.line*100)) : 100;
      const remain = ev.line - ev.joinCount;
      const lineMsg = (remain>0) ? ('あと'+remain+'人で開催ライン') : '<span class="line-ok">開催ライン到達！</span>';
      const nameLine = ev.eventName ? '<div style="font-weight:bold;color:#1a73e8;margin-top:4px;">'+escapeHtml(ev.eventName)+'</div>' : '';
      const saving = !!savingEvents[ev.eventId];
      const isNormal = ev.kind === '通常活動';   // 自由練習は通常活動の日だけ（隣のコートが使える）
      const joinBody = ev.join.length ? ev.join.map(personHtml).join('') : '<span style="color:#aaa">まだいません</span>';
      const shootingHtml = (isNormal && ev.shooting && ev.shooting.length)
        ? '<div class="roster"><span class="label">🏀 隣のコートの自由練習('+ev.shooting.length+')</span> <span style="font-size:11px;color:#aaa;">※上の名簿とは別集計（隣のコート）</span><br>'+ev.shooting.map(personHtml).join('')+'</div>'
        : '';
      const div = document.createElement('div');
      div.className = 'event';
      div.innerHTML =
        '<div class="ev-head"><span class="ev-date">'+ev.date+'</span><span class="'+tagClass(ev.kind)+'">'+escapeHtml(ev.kind)+'</span></div>'+
        nameLine+
        '<div class="ev-sub">'+escapeHtml(ev.time)+'　'+escapeHtml(ev.venue)+'</div>'+
        '<div class="line-info">参加 '+ev.joinCount+' ／ 開催ライン '+ev.line+'　'+lineMsg+'</div>'+
        '<div class="bar-wrap"><div class="bar" style="width:'+pct+'%"></div></div>'+
        '<div class="breakdown">'+breakdownText(ev.join)+'</div>'+
        '<div class="roster"><span class="label">◯参加('+ev.joinCount+')</span><br>'+joinBody+'</div>'+
        '<div class="roster"><span class="label">△検討中('+ev.undecidedCount+')</span><br>'+(ev.undecided.map(personHtml).join('')||'<span style="color:#aaa">まだいません</span>')+'</div>'+
        shootingHtml+
        '<button class="add-guest" data-ev="'+escapeHtml(ev.eventId)+'" data-label="'+escapeHtml(ev.date+' '+(ev.eventName||ev.kind))+'">＋ 体験者を追加</button>'+
        '<div class="btns"'+(saving?' style="opacity:.55"':'')+'>'+
          '<button data-st="参加" class="'+(ev.myStatus==='参加'?'on-join':'')+'"'+(saving?' disabled':'')+'>◯参加</button>'+
          '<button data-st="検討中" class="'+(ev.myStatus==='検討中'?'on-undecided':'')+'"'+(saving?' disabled':'')+'>△検討中</button>'+
          '<button data-st="不参加" class="'+(ev.myStatus==='不参加'?'on-absent':'')+'"'+(saving?' disabled':'')+'>×不参加</button>'+
        '</div>'+
        (isNormal ? '<div class="btns"'+(saving?' style="opacity:.55"':'')+'><button data-st="自由練習" class="'+(ev.myStatus==='自由練習'?'on-shooting':'')+'"'+(saving?' disabled':'')+'>🏀 自由練習（隣のコート）</button></div>' : '')+
        '<div class="mystat">あなたの回答：'+(ev.myStatus||'未回答')+'</div>';
      div.querySelectorAll('.btns button').forEach(function(b){
        b.addEventListener('click', function(){ setStatus(ev.eventId, b.getAttribute('data-st')); });
      });
      div.querySelectorAll('.add-guest').forEach(function(b){
        b.addEventListener('click', function(){ openGuestModal(b.getAttribute('data-ev'), b.getAttribute('data-label')); });
      });
      div.querySelectorAll('.guest-rm').forEach(function(x){
        x.addEventListener('click', function(){ removeGuestClient(x.getAttribute('data-gid')); });
      });
      wrap.appendChild(div);
    });
  }

  function setStatus(eventId, status){
    if (savingEvents[eventId]) return;   // その活動が送信中なら無視（連打防止）
    savingEvents[eventId] = true;
    const ev = boardData.find(function(e){ return e.eventId === eventId; });
    if (ev){
      ev.join = ev.join.filter(function(p){ return !p.me; });
      ev.undecided = ev.undecided.filter(function(p){ return !p.me; });
      ev.shooting = (ev.shooting||[]).filter(function(p){ return !p.me; });
      const me = { displayName: myProfile.displayName, level: myProfile.level, category: myProfile.category, transport: myProfile.transport, me: true };
      if (status === '参加') ev.join.push(me);
      else if (status === '検討中') ev.undecided.push(me);
      else if (status === '自由練習') ev.shooting.push(me);
      ev.joinCount = ev.join.length;
      ev.undecidedCount = ev.undecided.length;
      ev.myShooting = (status === '自由練習');
      ev.myStatus = status;
      render(boardData);
    }
    callApi({ action:'setAttendance', userId:userId, eventId:eventId, status:status })
      .then(function(res){
        delete savingEvents[eventId];
        if(!(res && res.ok)){ alert('保存に失敗：'+(res&&res.error)); refresh(); }
        else { render(boardData); }   // 送信中表示（無効化）を解除
      })
      .catch(function(e){ delete savingEvents[eventId]; alert('保存に失敗：'+e); refresh(); });
  }

  function refresh(){
    return callApi({ action:'getBoard', userId:userId }).then(function(res){
      if(res && res.ok){ boardData = res.data; render(boardData); }
    });
  }

  let guestEventId = null;
  function openGuestModal(eventId, label){
    guestEventId = eventId;
    document.getElementById('guestEvLabel').textContent = label || '';
    document.getElementById('guestName').value = '';
    document.querySelectorAll('input[name=glevel]').forEach(function(r){ r.checked=false; });
    document.getElementById('guestModal').style.display='block';
  }
  function closeGuestModal(){ document.getElementById('guestModal').style.display='none'; }
  document.getElementById('guestCancel').addEventListener('click', closeGuestModal);
  document.getElementById('guestModal').addEventListener('click', function(e){ if(e.target===this) closeGuestModal(); });
  document.getElementById('guestSubmit').addEventListener('click', function(){
    const name = document.getElementById('guestName').value.trim();
    const lv = document.querySelector('input[name=glevel]:checked');
    if(!name){ alert('お名前を入力してください'); return; }
    if(!lv){ alert('レベルを選んでください'); return; }
    const btn=this; btn.disabled=true;
    callApi({ action:'addGuest', userId:userId, eventId:guestEventId, name:name, level:lv.value })
      .then(function(res){ btn.disabled=false; if(res&&res.ok){ closeGuestModal(); refresh(); } else { alert('追加に失敗：'+(res&&res.error)); } })
      .catch(function(e){ btn.disabled=false; alert('追加に失敗：'+e); });
  });
  function removeGuestClient(guestId){
    if(!confirm('この体験者を削除しますか？')) return;
    callApi({ action:'removeGuest', userId:userId, guestId:guestId })
      .then(function(res){ if(res&&res.ok){ refresh(); } else { alert('削除に失敗：'+(res&&res.error)); } })
      .catch(function(e){ alert('削除に失敗：'+e); });
  }

  async function main(){
    try {
      // 読み込み中はバスケのアニメ表示（テキストで上書きしない）
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      const profile = await liff.getProfile();
      userId = profile.userId;
      myProfile.displayName = profile.displayName || '';
      const results = await Promise.all([
        callApi({ action:'getProfile', userId:userId }).catch(function(){ return null; }),
        callApi({ action:'getBoard',   userId:userId }).catch(function(){ return null; })
      ]);
      const pr = results[0], br = results[1];
      if (pr && pr.ok && pr.data){ myProfile.level=pr.data.level||''; myProfile.category=pr.data.category||''; myProfile.transport=pr.data.transport||''; if(pr.data.displayName) myProfile.displayName=pr.data.displayName; }
      else { document.getElementById('regBanner').style.display='block'; }  // 未登録なら登録を促すバナー
      if (br && br.ok){ boardData = br.data; render(boardData); }
      loadingEl.style.display='none';
      document.getElementById('container').style.display='block';
    } catch(err){ loadingEl.textContent = '初期化エラー：' + err; }
  }
  main();
</script>
</body>
</html>
